name = "cyber-study-hub"
compatibility_date = "2026-09-01"
main = "src/worker/index.mjs"
workers_dev = true

# More specific than the existing ArtiSys host route: no DNS changes.
[[routes]]
pattern = "artisys.dev/academy"
zone_name = "artisys.dev"

[[routes]]
pattern = "artisys.dev/academy/*"
zone_name = "artisys.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "HUB_AUTH"
class_name = "HubAuthObject"

[[migrations]]
tag = "hub-auth-sqlite-v1"
new_sqlite_classes = ["HubAuthObject"]

[secrets]
required = ["HUB_BOOTSTRAP_KEY"]

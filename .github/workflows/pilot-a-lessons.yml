name: Pilot A Lessons QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/course-library/**'
      - 'public/course-labs/pilot-a/**'
      - 'public/course-labs/a10-20/**'
      - 'scripts/test-lessons-10-20.mjs'
      - 'scripts/test-grade-a-10-20.mjs'
      - 'quality/reviews/a10-20-2026-10-13.json'
      - 'src/content/main/047/lesson.json'
      - 'src/components/curriculum/**'
      - 'src/components/lesson-v2/LessonViewerV2.tsx'
      - 'src/components/lesson-v2/quizCommit.ts'
      - 'scripts/test-quiz-commit.mjs'
      - 'scripts/test-pilot-a.mjs'
      - 'scripts/test-markdown-support.mjs'
      - 'docs/quality/PILOTO_A_8.md'
      - '.github/workflows/pilot-a-lessons.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify documents, links, exercises and Markdown policy
        run: |
          node scripts/test-pilot-a.mjs
          node --experimental-strip-types scripts/test-markdown-support.mjs
          node --experimental-strip-types scripts/test-quiz-commit.mjs
      - name: Verify lessons 010–020 with local deterministic tests
        run: |
          node scripts/test-lessons-10-20.mjs
          node scripts/test-grade-a-10-20.mjs
          node --test public/course-labs/a10-20/lab.test.mjs
      - name: Execute Python labs and independent tests
        run: |
          python3 public/course-labs/pilot-a/test_pilot.py
          python3 public/course-labs/phase16-logic/test_logic.py
          python3 public/course-labs/phase16-memory/run.py investigate
          python3 public/course-labs/phase16-foundations/tls_local.py
      - name: Compile PIE and non-PIE own binaries and observe
        run: |
          cc -O0 -fPIE -pie -o /tmp/csh-pilot-pie public/course-labs/pilot-a/aslr_observe.c
          cc -O0 -fno-pie -no-pie -o /tmp/csh-pilot-nopie public/course-labs/pilot-a/aslr_observe.c
          python3 public/course-labs/pilot-a/check_aslr.py /tmp/csh-pilot-pie /tmp/csh-pilot-nopie
      - name: CSRF laboratory
        working-directory: public/course-labs/phase16-web-p0
        run: |
          npm ci --no-audit --no-fund
          node --test --test-name-pattern='CSRF|SSRF|OAuth/OIDC' web.test.mjs
      - name: Web Cache Deception laboratory
        working-directory: public/course-labs/aula-047
        run: |
          npm ci --no-audit --no-fund
          node --test lab.test.mjs
      - name: Verify application build and P0 quality register
        run: |
          npm install --no-audit --no-fund
          npm run build

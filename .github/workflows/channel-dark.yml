name: Trilha Canais Dark QA
on:
  pull_request:
    paths:
      - 'src/trails/channel-dark/**'
      - 'public/course-labs/channel-dark/**'
      - 'src/App.tsx'
      - 'src/components/Dashboard.tsx'
      - 'scripts/test-channel-dark.mjs'
      - 'scripts/verify-channel-dark.mjs'
      - 'quality/trails/channel-dark/**'
      - 'package.json'
      - '.github/workflows/channel-dark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Testar contrato da trilha
        run: npm run verify:channel-dark
      - name: Compilar e validar currículo existente
        run: npm run build
      - name: Verificar isolamento da plataforma
        run: npm run test:platform

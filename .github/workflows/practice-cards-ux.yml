name: Lab cards mobile readability and teaching UX
on:
  pull_request:
    paths:
      - 'src/components/practice/**'
      - 'src/trails/ai-dev/**'
      - 'src/trails/channel-dark/**'
      - 'scripts/test-practice-cards-ux.mjs'
      - '.github/workflows/practice-cards-ux.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: UI contract, contrast and 607 canonical IDs
        run: node --test scripts/test-practice-cards-ux.mjs
      - name: Install and build whole site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Existing lesson, progress and route regression
        run: |
          node --test scripts/test-p0-p1-unified-lessons.mjs
          node --test scripts/test-study-continuity.mjs

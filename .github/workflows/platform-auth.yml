name: Platform auth and user isolation
on:
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'wrangler.toml'
      - 'scripts/check-cloudflare-worker.mjs'
      - 'scripts/test-cloudflare.mjs'
      - '.github/workflows/platform-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:hub-ux
      - run: npm run test:kdf
      - run: npm run test:platform
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/hub-worker-check
      - run: npm run test:worker

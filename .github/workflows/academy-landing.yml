name: Academy landing smoke checks
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/AcademyLanding.tsx'
      - 'src/components/academy.css'
      - 'src/components/academy-motion.css'
      - 'src/components/useAcademyMotion.ts'
      - 'scripts/test-academy-landing.mjs'
      - 'scripts/test-academy-motion.mjs'
      - '.github/workflows/academy-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-academy-landing.mjs scripts/test-academy-motion.mjs

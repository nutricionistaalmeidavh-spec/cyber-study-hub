name: Aulas 151-160 QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/course-library/main/15*.md'
      - 'public/course-library/main/160.md'
      - 'public/course-labs/a151-159/**'
      - 'quality/registry.json'
      - 'quality/reviews/a151-159-2026-10-14.json'
      - 'scripts/test-grade-a-151-160.mjs'
      - 'package.json'
      - '.github/workflows/a-151-160.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar modelos locais e casos negativos
        run: node --test public/course-labs/a151-159/lab.test.mjs
      - name: Validar aulas, notas, inventario e bundle
        run: |
          npm ci --no-audit --no-fund
          npm run build

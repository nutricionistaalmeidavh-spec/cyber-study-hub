name: Academy password recovery
on:
  pull_request:
    paths:
      - 'src/auth/password-reset.mjs'
      - 'src/worker/index.mjs'
      - 'src/components/PlatformGate.tsx'
      - 'server/password-reset.test.mjs'
      - 'server/platform.mjs'
      - 'server/send-email.mjs'
      - 'server/start.mjs'
      - 'wrangler.toml'
      - '.github/workflows/password-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/auth/password-reset.mjs && node --check src/worker/index.mjs && node --check server/platform.mjs
      - run: node --test server/password-reset.test.mjs

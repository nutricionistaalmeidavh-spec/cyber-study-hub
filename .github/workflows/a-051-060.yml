name: Aulas 051-060 QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/course-library/main/05*.md'
      - 'public/course-library/main/060.md'
      - 'public/course-labs/a051-060/**'
      - 'quality/registry.json'
      - 'quality/reviews/a51-60-2026-10-13.json'
      - 'scripts/test-grade-a-51-60.mjs'
      - 'package.json'
      - '.github/workflows/a-051-060.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic local Web/AppSec models
        run: node --test public/course-labs/a051-060/labs.test.mjs
      - name: Test preserved path/symlink lab
        run: node public/course-labs/phase16-web-p0/paths.mjs
      - name: Verify curriculum, editorial grade hashes and production bundle
        run: |
          npm ci --no-audit --no-fund
          npm run build

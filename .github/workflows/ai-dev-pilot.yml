name: Trilha IA — Módulos 01 a 05
on:
  pull_request:
    paths:
      - 'src/trails/ai-dev/**'
      - 'public/course-labs/ai-dev-meu-gestor/**'
      - 'src/App.tsx'
      - 'src/components/Dashboard.tsx'
      - 'scripts/verify-ai-dev.mjs'
      - 'package.json'
      - '.github/workflows/ai-dev-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Matriz curricular e auditorias A
        run: npm run verify:ai-dev
      - name: Laboratório M01
        run: node --test public/course-labs/ai-dev-meu-gestor/tests/starter.test.mjs
      - name: Laboratório M02
        run: node --test public/course-labs/ai-dev-meu-gestor/module-02/spec-rules.test.mjs
      - name: Meu Gestor v0.1 - build
        working-directory: public/course-labs/ai-dev-meu-gestor/checkpoints/v0.1
        run: npm install --no-audit --no-fund && npm run build
      - name: Meu Gestor v0.2 - build
        working-directory: public/course-labs/ai-dev-meu-gestor/checkpoints/v0.2
        run: npm install --no-audit --no-fund && npm run build
      - name: Meu Gestor v0.3 - testes e build
        working-directory: public/course-labs/ai-dev-meu-gestor/checkpoints/v0.3
        run: npm install --no-audit --no-fund && npm test && npm run build
      - name: Build HubEstudos
        run: npm run build
      - name: Regressão autenticação
        run: npm run test:platform

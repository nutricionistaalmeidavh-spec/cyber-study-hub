name: Safe Worker runtime bootstrap

on:
  pull_request:
    paths:
      - 'wrangler.toml'
      - 'src/worker/runtime-bootstrap.mjs'
      - 'scripts/test-worker-bootstrap.mjs'
      - '.github/workflows/worker-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir /tmp/hub-worker-check
      - run: node scripts/test-worker-bootstrap.mjs

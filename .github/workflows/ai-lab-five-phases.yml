name: Meu Gestor five-stage learning path
on:
  pull_request:
    paths:
      - 'src/trails/ai-dev/**'
      - 'scripts/test-ai-lab-five-phases.mjs'
      - 'scripts/test-practice-cards-ux.mjs'
      - 'scripts/test-p0-p1-unified-lessons.mjs'
      - 'scripts/test-study-continuity.mjs'
      - '.github/workflows/ai-lab-five-phases.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Five phases, files and all 607 IDs
        run: node --test scripts/test-ai-lab-five-phases.mjs scripts/test-practice-cards-ux.mjs
      - name: Build and progress regression
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/test-p0-p1-unified-lessons.mjs scripts/test-study-continuity.mjs
          npm run build

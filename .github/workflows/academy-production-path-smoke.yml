name: Academy production path smoke
on:
  pull_request:
    paths:
      - 'scripts/smoke-academy-live-route.mjs'
      - '.github/workflows/academy-production-path-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/smoke-academy-live-route.mjs

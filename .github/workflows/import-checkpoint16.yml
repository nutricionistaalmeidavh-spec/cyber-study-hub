name: Import CyberStudyHub Checkpoint 02
on:
  push:
    branches:
      - chore/prepare-phase16-checkpoint02-integration
    paths:
      - .integration/checkpoint02.tar.xz
      - scripts/import-checkpoint16.sh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cyberhub-checkpoint02-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/chore/prepare-phase16-checkpoint02-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and verify checkpoint (no deploy)
        run: bash scripts/import-checkpoint16.sh .integration/checkpoint02.tar.xz
      - name: Commit verified integration to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .integration/checkpoint02.tar.xz
          git rm -- .github/workflows/import-checkpoint16.yml
          git add -A
          git -c core.whitespace=-blank-at-eol diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'feat: integrate Cyber Study Hub phases 00-16 checkpoint 02'
          git push origin "HEAD:${GITHUB_REF_NAME}"
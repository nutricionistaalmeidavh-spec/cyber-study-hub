name: Hub UI UX desktop and mobile
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/Dashboard.tsx'
      - 'src/components/curriculum/CourseCatalog.tsx'
      - 'src/components/curriculum/course-catalog.css'
      - 'src/lib/courseDiscovery.ts'
      - 'qa/**'
      - 'scripts/test-course-discovery.mjs'
      - '.github/workflows/hub-ui-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:course-discovery
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui-ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-ui-ux-desktop-mobile
          path: |
            qa-results/
            qa-report/
          retention-days: 14
